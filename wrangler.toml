# Cloudflare Workers + static assets (PWA)
# prebuild hook auto-resolves PUSH_KV namespace id before deploy (see scripts/ensure-cloudflare-push-setup.mjs)
name = "chdmanagementwebapp5"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "PUSH_KV"
id = "00000000000000000000000000000000"

[assets]
directory = "./dist"
binding = "ASSETS"
# Missing static files return 404; worker/index.ts serves index.html for HTML navigations only.
not_found_handling = "none"
