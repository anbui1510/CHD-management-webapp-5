# Cloudflare Workers + static assets (PWA)
# prebuild hook auto-resolves PUSH_KV namespace id before deploy (see scripts/ensure-cloudflare-push-setup.mjs)
name = "chdmanagementwebapp5"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[[kv_namespaces]]
binding = "PUSH_KV"
id = "00000000000000000000000000000000"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
